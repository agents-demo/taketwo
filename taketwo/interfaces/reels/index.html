<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050507" />
    <title>TakeTwo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="splash-inner"><span class="k broken">IT'S BROKEN</span><span class="k fixed">FIXED</span></div>
      <div class="splash-sub">TakeTwo — watch it get fixed</div>
    </div>

    <main id="deck" aria-live="polite"></main>

    <div class="hud">
      <div class="hud-brand"><span class="mark">▶</span> TakeTwo</div>
      <button class="approve" id="approve" title="Approve the fix">Looks good ✅</button>
      <div class="hud-rail">
        <button data-act="score" title="Fixes">🏆</button>
        <button data-act="like" title="React">🤍</button>
        <button data-act="new" title="New clip">＋</button>
      </div>
    </div>
    <div class="swipe-hint">▲ swipe</div>
    <button id="dev" class="dev" title="Developer view">⋯</button>

    <div id="scrim" class="scrim" hidden></div>
    <div id="sheet" class="sheet" hidden></div>
    <div id="flash" class="flash" hidden><span>FIXED</span> ✅</div>
    <div id="toast" class="toast" hidden></div>

    <script src="app.js"></script>
  </body>
</html>
