<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0B0F" />
    <title>TakeTwo — fixes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><span class="mark">▶</span> TakeTwo</div>
      <div class="top-actions">
        <button class="ghost" id="score" title="Fixes">🏆</button>
        <button class="ghost" id="new" title="New clip">＋</button>
        <button class="ghost" id="dev" title="Developer view">⋯</button>
      </div>
    </header>

    <main id="feed" aria-live="polite"></main>

    <div id="scrim" class="scrim" hidden></div>
    <div id="sheet" class="sheet" hidden></div>
    <div id="flash" class="flash" hidden><span>FIXED</span> ✅</div>
    <div id="toast" class="toast" hidden></div>

    <script src="app.js"></script>
  </body>
</html>
