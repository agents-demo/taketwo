[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taketwo"
version = "0.1.0"
description = "Turn a screen recording of a bug into a reproduction, a fix, and a before/after proof video."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "python-dotenv>=1.0",
    # Runtime dependency provided by the host environment (not on PyPI): openjiuwen
]

[project.optional-dependencies]
video = ["numpy>=1.26", "Pillow>=10", "imageio>=2.34", "imageio-ffmpeg>=0.4", "opencv-python>=4.9"]
ocr = ["pytesseract>=0.3"]
browser = ["playwright>=1.44"]
forge = ["PyGithub>=2.3"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
mcp = ["mcp>=1.2"]
web = ["streamlit>=1.36"]
dev = ["pytest>=7", "ruff>=0.6"]
all = [
    "numpy>=1.26", "Pillow>=10", "imageio>=2.34", "imageio-ffmpeg>=0.4", "opencv-python>=4.9",
    "pytesseract>=0.3",
    "playwright>=1.44",
    "PyGithub>=2.3",
    "fastapi>=0.110", "uvicorn>=0.29",
    "mcp>=1.2",
    "streamlit>=1.36",
    "pytest>=7", "ruff>=0.6",
]

[project.scripts]
taketwo = "taketwo.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["taketwo*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501 handled by `ruff format`; B905 (zip strict) is a style preference.
ignore = ["E501", "B905"]

[tool.ruff.lint.per-file-ignores]
"conftest.py" = ["E402"]
"scripts/*.py" = ["E402"]
"tests/**/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
