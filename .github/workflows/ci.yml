name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest -q
      # Offline end-to-end: seed the sample bug, run it, and gate quality.
      - run: python scripts/make_sample_bug.py
      - run: python -m taketwo.interfaces.cli record runtime/data/sample_bug.mov
      - run: python scripts/evaluate_repros.py
